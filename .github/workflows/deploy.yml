name: Deploy https://hangtiancheng.github.io/h homepage

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: Deploy homepage' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build with VitePress
        run: pnpm build
      - name: Build swifty-docs site
        run: pnpm build:docs
      - name: Merge swifty-docs site into /h/swifty-docs/
        run: |
          mkdir -p ./.vitepress/dist/swifty-docs
          cp -r ./dist-swifty/* ./.vitepress/dist/swifty-docs/
      - name: Build with Rspress
        run: pnpm build:rspress
      - name: Merge Rspress site into /h/rspress/
        run: |
          mkdir -p ./.vitepress/dist/rspress
          cp -r ./doc_build/* ./.vitepress/dist/rspress/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.vitepress/dist

  deploy:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: Deploy homepage' }}"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
