<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lark Homepage" />
    <meta name="theme-color" content="#f05138" />
    <link rel="icon" href="/h/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/h/apple-touch-icon-180x180.png" />
    <title>Lark Homepage</title>
    <script>
      // No-FOUC dark mode: resolve preference before first paint.
      (function () {
        try {
          var stored = localStorage.getItem("lark-docs-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
